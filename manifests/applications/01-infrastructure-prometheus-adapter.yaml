# ArgoCD Application for Prometheus Adapter (Wave 1 - Depends on Prometheus)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-adapter
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-result: ignore
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/instance: task-aura
    argocd.argoproj.io/instance: task-aura
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-adapter
      targetRevision: 4.14.1
      helm:
        values: |
          prometheus:
            url: http://prometheus-kube-prometheus-prometheus.monitoring.svc
            port: 9090
          rules:
            default: false
            custom:
              - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
                resources:
                  overrides:
                    namespace:
                      resource: "namespace"
                    pod:
                      resource: "pod"
                name:
                  as: "http_requests_per_second"
                metricsQuery: 'sum(rate(http_requests_total{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
              - seriesQuery: 'kafka_consumer_lag{namespace!="",pod!=""}'
                resources:
                  overrides:
                    namespace:
                      resource: "namespace"
                    pod:
                      resource: "pod"
                name:
                  as: "kafka_consumer_lag"
                metricsQuery: 'max(kafka_consumer_lag{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m