# ArgoCD Application for Prometheus (Wave 0 - First infrastructure component)
# Deployed first as it provides metrics infrastructure for other components
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  # Wave 0: Deploy first (no dependencies)
  annotations:
    argocd.argoproj.io/compare-result: ignore
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/instance: task-aura
    argocd.argoproj.io/instance: task-aura
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 83.0.0
    helm:
      skipCrds: false
      values: |
        crds:
          enabled: true
        prometheus:
          prometheusSpec:
            retention: 2d
            serviceMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
        grafana:
          enabled: false
        alertmanager:
          enabled: false
        kubeStateMetrics:
          enabled: true
        nodeExporter:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - Replace=true
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
