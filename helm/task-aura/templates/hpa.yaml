{{- if .Values.customerFacing.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-facing-hpa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: customer-facing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-facing
  
  minReplicas: {{ .Values.customerFacing.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.customerFacing.autoscaling.maxReplicas }}
  
  metrics:
  # Scale based on HTTP request rate (via Prometheus)
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "{{ .Values.customerFacing.autoscaling.targetHttpRequestsPerSecond }}"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
{{- end }}

{{- if .Values.customerMgmt.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-mgmt-hpa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: customer-mgmt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-mgmt
  
  minReplicas: {{ .Values.customerMgmt.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.customerMgmt.autoscaling.maxReplicas }}
  
  metrics:
  # Scale based on Kafka consumer lag (custom metric)
  - type: Pods
    pods:
      metric:
        name: kafka_consumer_lag
      target:
        type: AverageValue
        averageValue: "{{ .Values.customerMgmt.autoscaling.targetKafkaConsumerLag }}"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      selectPolicy: Max
---
{{- end }}
