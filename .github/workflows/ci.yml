name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
    - uses: actions/checkout@v5

    - name: Detect changed paths
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          app:
            - 'app/**'

  lint-and-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r app/requirements.txt
    
    - name: Lint with pylint
      continue-on-error: true
      run: |
        python -m pip install pylint
        pylint app/customer_facing app/customer_mgmt app/common --disable=all --enable=E,F
    
    - name: Format check with black
      continue-on-error: true
      run: |
        python -m pip install black
        black --check app/
    
    - name: Run pytest tests
      run: |
        python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  build-and-push:
    needs:
    - changes
    - lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - name: customer-facing
          dockerfile: ./app/customer_facing/Dockerfile
          context: .
          image: task-aura-customer-facing
        - name: customer-mgmt
          dockerfile: ./app/customer_mgmt/Dockerfile
          context: .
          image: task-aura-customer-mgmt
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Set short SHA
      id: vars
      run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    
    - name: Build and push ${{ matrix.name }} image
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:${{ steps.vars.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan ${{ matrix.name }} image with Trivy
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:latest
        format: 'table'
        severity: 'CRITICAL,HIGH'

  validate-manifests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Install Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    
    - name: Lint Helm chart
      run: |
        helm lint helm/task-aura/

  security-checks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      continue-on-error: true
      with:
        config: >-
          p/security-audit
          p/python
